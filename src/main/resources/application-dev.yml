spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ENC(your-encrypted-value-here)
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: reporthole.noreply@gmail.com
    password: ENC(jasypt-encrypted-app-password)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

mail:
  from: reporthole.noreply@gmail.com
  verification-url: https://reporthole.app/verify?token=
  verification-subject: "Verify your Reporthole account"
  password-reset-url: https://reporthole.app/reset-password?token=
  password-reset-subject: "Reset your Reporthole password"

services:
  web:
    allowed:
      - http://localhost:3000
      - http://192.168.*:3000
      - http://10.*:3000