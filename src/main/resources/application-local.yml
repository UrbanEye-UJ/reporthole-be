#Switch the below to JASYPT then share the details
spring:
  datasource:
    url: jdbc:h2:mem:reporthole;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

services:
  web:
    allowed:
      - http://localhost:3000
      - http://192.168.*:3000
      - http://10.*:3000
      - http://172.*:3000