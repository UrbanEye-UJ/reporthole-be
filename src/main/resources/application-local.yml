spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reporthole
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        globally_quoted_identifiers: false
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

mail:
  from: reporthole.noreply@localhost
  verification-url: https://localhost:3000/verify?token=
  verification-subject: "Verify your Reporthole account"
  password-reset-url: https://localhost:3000/reset-password?token=
  password-reset-subject: "Reset your Reporthole password"
  admin-application-subject: "Admin Access Request — Reporthole"

services:
  web:
    base-url: ${SERVICES_WEB_BASE_URL:}
    allowed:
      - http://localhost:3000
      - https://localhost:3000
      - https://localhost
      - http://192.168.*:3000
      - https://192.168.*:3000
      - http://10.*:3000
      - https://10.*:3000
      - http://172.*:3000
      - https://172.*:3000
