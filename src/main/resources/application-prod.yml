spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    # V1 already matches what ddl-auto:update had built on any existing database: baselining
    # (rather than re-running V1's CREATE TABLEs) only kicks in when the schema is non-empty and
    # has no flyway_schema_history yet — a genuinely fresh database still runs V1 for real.
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  bootstrap-admin:
    enabled: true
    # email defaults to reporthole.team@gmail.com — set APP_BOOTSTRAP_ADMIN_PASSWORD in the environment
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:1@qwerty}
  bootstrap-municipalities:
    enabled: true

management:
  health:
    mail:
      enabled: false

mail:
  from: reporthole.team@gmail.com
  verification-url: ${SERVICES_WEB_BASE_URL_FRONTEND}/verify?token=
  verification-subject: "Verify your Reporthole account"
  password-reset-url: ${SERVICES_WEB_BASE_URL_FRONTEND}/reset-password?token=
  password-reset-subject: "Reset your Reporthole password"

services:
  web:
    base-url: ${SERVICES_WEB_BASE_URL:}
    allowed:
      - ${SERVICES_WEB_BASE_URL_FRONTEND}

