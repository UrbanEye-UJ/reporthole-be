spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  # Flyway's V1 baseline is Postgres-specific (PostGIS geometry columns, etc.) and won't run
  # against H2 — tests keep building their schema from the entity model via ddl-auto above.
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

services:
  web:
    allowed:
      - http://localhost:3000,
      - http://192.168.*:3000,
      - http://10.*:3000,
      - http://172.*:3000
