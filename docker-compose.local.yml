services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: reporthole-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reporthole
    env_file:
      - .env
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - reporthole-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d reporthole"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: reporthole-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - reporthole-net
    env_file:
      - .env

  reporthole-be:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reporthole-be
    environment:
      SPRING_PROFILES_ACTIVE: local
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD}
      SERVICES_WEB_BASE_URL: ${SERVICES_WEB_BASE_URL:-http://localhost:8080/api}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://reporthole-postgres:5432/reporthole
      SPRING_MAIL_HOST: reporthole-mailhog
      SPRING_MAIL_PORT: 1025
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads/incidents
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reporthole-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  reporthole-ui:
    profiles: ["full"]
    build:
      context: ../reporthole-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        INTERNAL_API_URL: http://reporthole-be:8080/api
    container_name: reporthole-ui
    environment:
      APP_ENV: ${APP_ENV:-local}
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
      INTERNAL_API_URL: http://reporthole-be:8080/api
    ports:
      - "3000:3000"
    networks:
      - reporthole-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Reverse proxy — same Caddyfile as prod, so /pgadmin and /logs behave identically
  # in both environments. Not gated behind the "full" profile: it's useful even when
  # reporthole-be/reporthole-ui run natively (IntelliJ/next dev), since the Caddyfile's
  # reverse_proxy directives fall back to host.docker.internal when the containerized
  # backend/frontend aren't up.
  caddy:
    image: caddy:2-alpine
    container_name: reporthole-caddy
    # Entrypoint hashes POSTGRES_PASSWORD into DEV_TOOLS_PASSWORD_HASH at startup — see
    # infra/caddy-entrypoint.sh. DEV_TOOLS_USERNAME reuses MAIL_USERNAME rather than a
    # dedicated secret; both are what gate /pgadmin and /logs (infra/Caddyfile).
    entrypoint: ["/bin/sh", "/caddy-entrypoint.sh"]
    environment:
      DEV_TOOLS_USERNAME: ${MAIL_USERNAME}
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy-entrypoint.sh:/caddy-entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - reporthole-net
    restart: unless-stopped

  # Dev/ops tooling — DB browser, routed through Caddy at /pgadmin (see infra/Caddyfile),
  # gated there by Caddy's own basic_auth. Deliberately not published directly on the host —
  # that would bypass the basic_auth gate entirely.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reporthole-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-reporthole.team@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-1@qwerty}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      SCRIPT_NAME: /pgadmin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - reporthole-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # Dev/ops tooling — live container log viewer, routed through Caddy at /logs, gated
  # there by Caddy's own basic_auth. Deliberately not published directly on the host —
  # that would bypass the basic_auth gate entirely.
  dozzle:
    image: amir20/dozzle:latest
    container_name: reporthole-dozzle
    environment:
      DOZZLE_BASE: /logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - reporthole-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  uploads-data:
  postgres-data:
  pgadmin-data:
  caddy-data:
  caddy-config:

networks:
  reporthole-net:
    name: reporthole-net
    driver: bridge
