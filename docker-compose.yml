services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: reporthole-postgres
    environment:
      POSTGRES_USER: reporthole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reporthole}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - reporthole-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporthole -d reporthole"]
      interval: 10s
      timeout: 5s
      retries: 5

  reporthole-be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reporthole-be
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD}
      SERVICES_WEB_BASE_URL: ${SERVICES_WEB_BASE_URL:-http://localhost:8080/api}
    volumes:
      - uploads-data:/app/uploads/incidents
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reporthole-net
#    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres-data:
  uploads-data:

networks:
  reporthole-net:
    name: reporthole-net
    driver: bridge
