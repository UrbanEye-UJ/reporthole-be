services:

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: reporthole-postgres
    environment:
      POSTGRES_DB: reporthole
      POSTGRES_USER: reporthole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reporthole}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - reporthole-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporthole -d reporthole"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reporthole-redis
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - reporthole-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  reporthole-be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reporthole-be
    ports:
      - "8080:8080"
    environment:
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev

      # Override the ENC(...) placeholders in application-dev.yml
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reporthole
      SPRING_DATASOURCE_USERNAME: reporthole
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reporthole}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      APP_UPLOAD_DIR: /app/uploads/incidents
      APP_BASE_URL: http://localhost:8080/api
    volumes:
      - uploads-data:/app/uploads/incidents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reporthole-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres-data:
  redis-data:
  uploads-data:

networks:
  reporthole-net:
    name: reporthole-net
    driver: bridge
