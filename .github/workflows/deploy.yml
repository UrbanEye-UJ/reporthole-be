name: Deploy

# Manual trigger only — no auto-deploy on push or merge.
# Only Pule-Prince and refentse1 can trigger; all other actors see the job
# skipped without an approval gate or environment restriction.
on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service(s) to redeploy'
        required: true
        type: choice
        options:
          - backend
          - ui
          - both

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    # Actor allowlist — anyone else who triggers the dispatch sees this job
    # as skipped; no environment/required-reviewer dependency needed.
    if: contains(fromJSON('["Pule-Prince", "refentse1"]'), github.actor)
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        timeout-minutes: 15
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }} bash << 'ENDSSH'
          set -euo pipefail
          # Pull the BE repo first so the workflow always runs the latest deploy.sh.
          cd /home/ubuntu/reporthole-be && git pull && cd /home/ubuntu
          bash /home/ubuntu/reporthole-be/scripts/deploy.sh "${{ inputs.service }}"
          ENDSSH
